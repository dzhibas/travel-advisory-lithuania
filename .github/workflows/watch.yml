name: lt-advisory-watch

on:
  schedule:
    # GitHub's scheduler is best-effort and often runs 5-20 min late under load.
    # If you need tighter latency, run this on a VPS with a systemd timer instead.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: lt-advisory-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check advisories
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CONTACT: ${{ secrets.CONTACT }}
        run: python3 watch.py

      - name: Commit snapshots
        run: |
          git config user.name  "lt-advisory-watch"
          git config user.email "actions@users.noreply.github.com"
          git add state/
          git diff --staged --quiet || git commit -m "advisory snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
